# The texts of the e-mails, in French (UTF-8).
#
# {name} is replaced by a value that comes from the application: everything that comes from a person is
# escaped (HTML) or encoded (links) by EmailContentBuilder before it is put in place, so the HTML written
# here is the only HTML that ever goes out. To add a language, add emails_<language>.properties with the same keys.

account-validation.subject=Validation de votre compte
account-validation.html=Bonjour {pseudo},<br><br>\
Nous vous envoyons ce mail suite à la création de votre compte sur notre plateforme DnDGate.<br>\
Il vous reste une dernière étape avant de pouvoir profiter pleinement de nos services : valider votre adresse mail.<br>\
<br>\
Cliquez sur le lien ci-dessous pour vérifier votre compte :<br>\
<h3><a href="{link}">VERIFIER MON COMPTE</a></h3>\
Ce lien est valable 24 heures.<br>\
Si vous n'êtes pas à l'origine de cette inscription, ignorez simplement ce mail.<br>\
<br>\
Merci,<br>\
L'équipe DnDGate.

signup-confirmation.subject=Confirmation de votre inscription
signup-confirmation.html=Bonjour {pseudo},<br><br>\
Une inscription à la plateforme DnDGate a été demandée avec cette adresse mail.<br>\
Votre compte sera créé quand vous aurez confirmé votre adresse.<br>\
<br>\
Cliquez sur le lien ci-dessous pour confirmer votre inscription :<br>\
<h3><a href="{link}">CONFIRMER MON INSCRIPTION</a></h3>\
Ce lien est valable 24 heures.<br>\
Si vous n'êtes pas à l'origine de cette demande, ignorez simplement ce mail : aucun compte ne sera créé.<br>\
<br>\
Merci,<br>\
L'équipe DnDGate.

signup-attempt.subject=Tentative d'inscription avec votre adresse
signup-attempt.html=Bonjour {pseudo},<br><br>\
Quelqu'un a essayé de créer un compte DnDGate avec votre adresse mail, qui est déjà associée à votre compte.<br>\
Aucun nouveau compte n'a été créé et votre compte n'a pas été modifié.<br>\
<br>\
Si c'est vous, connectez-vous avec votre compte existant :<br>\
<h3><a href="{link}">ME CONNECTER</a></h3>\
Si vous n'êtes pas à l'origine de cette demande, ignorez simplement ce mail : votre compte n'a pas été modifié.<br>\
<br>\
Merci,<br>\
L'équipe DnDGate.

email-change.subject=Confirmation de votre nouvelle adresse
email-change.html=Bonjour {pseudo},<br><br>\
Une demande a été faite pour utiliser cette adresse mail sur votre compte DnDGate.<br>\
<br>\
Cliquez sur le lien ci-dessous pour la confirmer :<br>\
<h3><a href="{link}">CONFIRMER MA NOUVELLE ADRESSE</a></h3>\
Ce lien est valable 24 heures. Tant qu'il n'est pas utilisé, votre compte garde son ancienne adresse.<br>\
Si vous n'êtes pas à l'origine de cette demande, ignorez simplement ce mail.<br>\
<br>\
Merci,<br>\
L'équipe DnDGate.

invitation.subject=Invitation de {sender}
invitation.html=Salutation {receiver},<br>\
<br>\
{sender} vous a invité à rejoindre son aventure sur notre plateforme DnDGate.<br>\
Voici le code pour rejoindre la partie : {code}.<br>\
<br>\
L'équipe DnDGate.

# The e-mails about the game master of an adventure
master.html=Bonjour {pseudo},<br><br>\
{body}<br>\
<br>\
<a href="{link}">Ouvrir l'aventure</a><br>\
<br>\
L'équipe DnDGate.

# Who the message is about when it is not known
master.someone=Un joueur
master.someone.subject=un joueur

master.MASTER_STEPPED_DOWN.subject=Plus de MJ pour {adventure}
master.MASTER_STEPPED_DOWN.body={other} a quitté le rôle de MJ de l'aventure « {adventure} ».<br>\
L'aventure continue : l'un d'entre vous peut demander à devenir MJ (les autres joueurs voteront), ou le MJ peut être remplacé par une personne invitée.

master.MASTER_ACCOUNT_DELETED.subject=Plus de MJ pour {adventure}
master.MASTER_ACCOUNT_DELETED.body=Le MJ de l'aventure « {adventure} » a supprimé son compte.<br>\
L'aventure continue : l'un d'entre vous peut demander à devenir MJ (les autres joueurs voteront), ou une personne peut être invitée à le devenir.

master.CLAIM_OPENED.subject=Vote : {other} veut devenir MJ de {adventure}
master.CLAIM_OPENED.body={other} demande à devenir MJ de l'aventure « {adventure} ».<br>\
Tous les joueurs doivent être d'accord : donnez votre réponse dans les 7 jours, sans réponse de votre part le MJ ne change pas.

master.CLAIM_REJECTED.subject=Votre demande pour devenir MJ de {adventure}
master.CLAIM_REJECTED.body=Votre demande pour devenir MJ de l'aventure « {adventure} » a été refusée par l'un des joueurs.<br>\
Le MJ ne change pas.

master.CLAIM_CANCELLED.subject=Demande retirée pour {adventure}
master.CLAIM_CANCELLED.body={other} a retiré sa demande pour devenir MJ de l'aventure « {adventure} ».<br>\
Il n'y a plus de vote en cours.

master.YOU_ARE_NOW_MASTER.subject=Vous êtes MJ de {adventure}
master.YOU_ARE_NOW_MASTER.body=Vous êtes maintenant MJ de l'aventure « {adventure} ».<br>\
Vous avez accès aux notes privées du MJ.

master.YOU_ARE_NO_LONGER_MASTER.subject=Nouveau MJ pour {adventure}
master.YOU_ARE_NO_LONGER_MASTER.body={other} est maintenant MJ de l'aventure « {adventure} ».<br>\
Vous n'êtes plus MJ : vous êtes joueur si une place était libre, sinon vous avez quitté l'aventure (vos personnages sont conservés).

master.MASTER_CHANGED.subject=Nouveau MJ pour {adventure}
master.MASTER_CHANGED.body={other} est le nouveau MJ de l'aventure « {adventure} ».

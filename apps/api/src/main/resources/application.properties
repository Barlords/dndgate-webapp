spring.profiles.active=prod

# No database session kept open while the response is written: every access happens in an explicit transaction
spring.jpa.open-in-view=false

# Limits on what a client can send: files (5 MB pictures) and JSON bodies (512 KB, enough for the longest text fields)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.limits.max-body-bytes=524288

# A mail server that does not answer must not hold a sending thread for ever (mails leave in the background)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Game master: how long an invitation to take over stays valid, and how long the players have to answer a vote
game-master.invitation.ttl=P7D
game-master.claim.ttl=P7D

# Tomcat cuts the connection when the unread part of a refused upload exceeds this size (default 2 MB), which
# truncates the error answer: it is kept above the largest accepted request (6 MB) so that the client reads the 413
server.tomcat.max-swallow-size=8MB

# Operations: health probes and metrics are served on their own port, which the reverse proxy does not publish
# (never open it to the internet). Only these two endpoints exist; the health answer holds no details.
management.server.port=${MANAGEMENT_PORT:4001}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Ready = the database answers. The mail server is not part of it: a mail outage must not take the API out of service.
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false

# Keep the shared error schema even though it is only referenced by the customizer, after the cleaning
springdoc.remove-broken-reference-definitions=false

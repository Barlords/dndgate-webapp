spring.application.name=dndgate-api

## DataSource PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://${DB_SERVICE_NAME:localhost}:${DB_SERVICE_PORT:5432}/${DB_NAME:dndgate}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:dndgate}
spring.datasource.password=${DB_PASSWORD}

# Minio
minio.url=https://dndgate-minio.barlords.fr
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=dndgate

## Mail
spring.mail.host=ssl0.ovh.net
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# API url
server.port=${PORT:4000}
server.servlet.context-path=/${API_PATH:dndgate-api}


# Security
security.jwt.secret=${JWT_SECRET}
# Players come back about every 30 days: the refresh token (renewed at each use) must outlive that gap,
# and the session cap forces a real login with the password twice a year at most.
security.jwt.ttl=PT15M
security.refresh.ttl=P60D
security.session.max-lifetime=P180D
security.session.cleanup-cron=0 30 3 * * *
security.login.max-failed-attempts=5
security.login.lock-duration=PT15M
# Warn in the logs when this many different clients failed against one account within the lock window
security.login.distinct-clients-warning-threshold=50
security.rate-limit.login.max=10
security.rate-limit.login.window=PT1M
security.rate-limit.refresh.max=30
security.rate-limit.refresh.window=PT1M
security.rate-limit.register.max=5
security.rate-limit.register.window=PT1H
security.rate-limit.verify.max=20
security.rate-limit.verify.window=PT1M
security.rate-limit.resend.max=5
security.rate-limit.resend.window=PT1H
invitation.rate-limit.sender.max=20
invitation.rate-limit.sender.window=PT1H
invitation.rate-limit.recipient.window=PT24H
security.verification.ttl=PT24H
security.verification.resend-cooldown=PT1M
# One "someone tried to register with your address" notice per address in this window
security.signup-notice.window=PT24H
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://dndgate.barlords.fr}

# Behind the reverse proxy: take the client address from X-Forwarded-For (used by the rate limits)
server.forward-headers-strategy=native

# Web site: the links of the e-mails lead there
app.web-base-url=${WEB_BASE_URL:https://dndgate.barlords.fr}

# One JSON object per log line (with the correlationId of the request), for the log collector
logging.structured.format.console=logstash

# The OpenAPI contract is not served in production (it is committed in contracts/openapi.yaml)
springdoc.api-docs.enabled=false

# Technical ceilings, the same for everybody whatever the plan (the quotas of the plans are in plans/plans.json):
# spells in one spell book, messages one account sends per window (429 beyond), subscriptions of one WebSocket connection.
limits.spells-per-spell-book=1000
limits.messages.max=30
limits.messages.window=PT1M
limits.websocket.subscriptions-per-connection=20

# Stripe: required in production (no default; missing or blank, the API does not start)
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

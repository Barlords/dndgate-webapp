<dg-parchment>
  <p class="list__ruleset">{{ ruleset().label }}</p>
  <h1 class="list__title">{{ section().label }}</h1>
  @if (ruleset().untranslated(section().id)) {
    <dg-untranslated-note />
  }

  @if (section().tabs; as tabs) {
    <nav class="list__tabs" [attr.aria-label]="tabs.label">
      @for (option of tabs.options; track option.value) {
        <a
          class="list__tab"
          [routerLink]="[]"
          [queryParams]="tabQuery(option.value)"
          queryParamsHandling="merge"
          [attr.aria-current]="tab() === option.value ? 'page' : null"
          >{{ option.label }}</a
        >
      }
    </nav>
  }

  @if (failed()) {
    <div class="list__state">
      <dg-load-error
        [message]="t().library.list.loadError"
        [problem]="loadProblem()"
        (retry)="retry()"
      />
    </div>
  } @else if (entries() === null) {
    <div class="list__state">
      <dg-loading [label]="t().library.list.loading" [message]="section().loadingMessage" />
    </div>
  } @else {
    <dg-entry-table
      [ruleset]="ruleset()"
      [section]="section()"
      [entries]="tabEntries()"
      [rowActions]="bookable() ? bookAction : null"
      [actionsLabel]="t().library.list.spellbookColumn"
    />
  }
</dg-parchment>

<ng-template #bookAction let-entry>
  <dg-add-to-spellbook
    [rulesetId]="ruleset().id"
    [spellIndex]="entry.index"
    [spellName]="entry.name"
    [revealLabel]="false"
  />
</ng-template>

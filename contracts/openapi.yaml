components:
  schemas:
    Problem:
      type: object
      description: An error (RFC 9457 problem details). correlationId is the identifier
        to quote when reporting it.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          format: int32
          example: 404
        detail:
          type: string
          description: "What went wrong, in English."
        instance:
          type: string
          description: The path of the request.
        correlationId:
          type: string
          description: Same value as the X-Request-Id header.
        errors:
          type: array

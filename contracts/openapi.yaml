  /ratings:
    get:
      tags:
      - Ratings
      summary: Get ratings by account
      operationId: getRatingsByAccount
      parameters:
      - name: targetedAccountId
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDtoRatingDto"
        default:
          description: "The error, in the same shape whatever produced it (RFC 9457)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - Ratings
      summary: Put rating
      operationId: putRating
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingCreationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingDto"
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingDto"
        default:
          description: "The error, in the same shape whatever produced it (RFC 9457)."

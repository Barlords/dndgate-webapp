# Services d'infrastructure pour le développement local.
# Les valeurs par défaut correspondent à application-dev.properties de l'API.
services:

  dndgate-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dndgate
      POSTGRES_USER: ${DB_USER:-dndgate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dndgate}
    ports:
      - "5432:5432"
    volumes:
      - db_storage:/var/lib/postgresql/data

  dndgate-minio:
    image: minio/minio
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dndgate}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dndgate2024}
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  db_storage: {}
  minio_storage: {}
